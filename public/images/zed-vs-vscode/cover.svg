<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <g transform="translate(680, 120)">
    <rect x="0" y="0" width="420" height="280" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="0" y="0" width="420" height="32" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="16" r="5" fill="#ef4444"/>
    <circle cx="40" cy="16" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="16" r="5" fill="#22c55e"/>
    <g font-family="Courier New, monospace" font-size="14">
      <text x="20" y="65" fill="#64748b">1</text>
      <text x="45" y="65" fill="#c084fc">def</text>
      <text x="85" y="65" fill="#60a5fa">main</text>
      <text x="135" y="65" fill="#94a3b8">():</text>
      <text x="20" y="95" fill="#64748b">2</text>
      <text x="45" y="95" fill="#94a3b8">print(</text>
      <text x="100" y="95" fill="#fbbf24">"Hello"</text>
      <text x="160" y="95" fill="#94a3b8">)</text>
      <text x="20" y="125" fill="#64748b">3</text>
      <text x="45" y="125" fill="#c084fc">return</text>
      <text x="105" y="125" fill="#34d399">True</text>
      <text x="20" y="165" fill="#64748b">4</text>
      <text x="45" y="165" fill="#94a3b8"># Code rocks!</text>
      <text x="20" y="195" fill="#64748b">5</text>
      <text x="45" y="195" fill="#94a3b8">if __name__ ==</text>
      <text x="20" y="220" fill="#94a3b8">  "</text>
      <text x="40" y="220" fill="#fbbf24">__main__</text>
      <text x="135" y="220" fill="#94a3b8">":</text>
      <text x="20" y="250" fill="#22d3ee">▊</text>
    </g>
  </g>
  <text x="80" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Zed 编辑器体验</text>
  <text x="80" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#ffffff" opacity="0.7">小吒の博客 · 精选技术分享</text>
  <rect x="80" y="510" width="120" height="4" rx="2" fill="url(#grad)"/>
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#ffffff" opacity="0.6">开发工具 · 教程</text>
  <text x="1050" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#ffffff" opacity="0.5">xiaozha.org</text>
</svg>