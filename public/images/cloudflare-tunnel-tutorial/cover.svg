<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-cf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ea580c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c2410c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tunnel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-cf)"/>

  <circle cx="980" cy="120" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="1050" cy="500" r="220" fill="#ffffff" opacity="0.05"/>

  <g transform="translate(680, 180)" filter="url(#shadow)">
    <g transform="translate(0, 0)">
      <rect x="0" y="60" width="90" height="90" rx="10" fill="#1e293b"/>
      <rect x="15" y="78" width="60" height="6" rx="2" fill="#10b981"/>
      <rect x="15" y="92" width="50" height="4" rx="2" fill="#475569"/>
      <rect x="15" y="102" width="55" height="4" rx="2" fill="#475569"/>
      <rect x="15" y="112" width="40" height="4" rx="2" fill="#475569"/>
      <rect x="15" y="126" width="60" height="12" rx="3" fill="#10b981"/>
      <text x="45" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">本地服务</text>
    </g>

    <g transform="translate(130, 95)">
      <line x1="0" y1="20" x2="200" y2="20" stroke="#ffffff" stroke-width="3" stroke-dasharray="8,6" opacity="0.8"/>
      <polygon points="195,12 215,20 195,28" fill="#ffffff" opacity="0.95"/>
      <circle cx="50" cy="20" r="5" fill="#ffffff"/>
      <circle cx="100" cy="20" r="5" fill="#ffffff"/>
      <circle cx="150" cy="20" r="5" fill="#ffffff"/>
      <text x="100" y="0" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.9">Cloudflare Tunnel</text>
    </g>

    <g transform="translate(360, 0)" filter="url(#glow)">
      <ellipse cx="100" cy="130" rx="120" ry="45" fill="url(#cloud)"/>
      <ellipse cx="50" cy="110" rx="60" ry="45" fill="url(#cloud)"/>
      <ellipse cx="150" cy="115" rx="55" ry="40" fill="url(#cloud)"/>
      <ellipse cx="90" cy="85" rx="55" ry="40" fill="url(#cloud)"/>
      <ellipse cx="130" cy="75" rx="45" ry="35" fill="url(#cloud)"/>
      <text x="100" y="135" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ea580c" text-anchor="middle">全球公网</text>
    </g>
  </g>

  <text x="80" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    免费内网穿透
  </text>
  <text x="80" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#ffffff" opacity="0.95">
    Cloudflare Tunnel 实战教程
  </text>
  <text x="80" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#ffffff" opacity="0.85">
    让本地 AI 服务触达全球
  </text>

  <rect x="80" y="380" width="140" height="5" rx="2" fill="#ffffff" opacity="0.9"/>

  <text x="80" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.9">
    小吒の博客
  </text>
  <text x="940" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#ffffff" opacity="0.75">
    Cloudflare · 教程 · 内网穿透
  </text>
</svg>
