<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-docker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docker-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-docker)"/>

  <g opacity="0.08">
    <rect x="60" y="60" width="40" height="20" fill="#3b82f6"/>
    <rect x="105" y="60" width="40" height="20" fill="#3b82f6"/>
    <rect x="150" y="60" width="40" height="20" fill="#3b82f6"/>
    <rect x="60" y="85" width="40" height="20" fill="#3b82f6"/>
    <rect x="105" y="85" width="40" height="20" fill="#3b82f6"/>
  </g>

  <circle cx="1050" cy="500" r="200" fill="#3b82f6" opacity="0.08"/>
  <circle cx="950" cy="120" r="120" fill="#06b6d4" opacity="0.08"/>

  <g transform="translate(720, 150)" filter="url(#shadow)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="320" height="220" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
      <rect x="0" y="0" width="320" height="40" rx="12" fill="#334155"/>
      <rect x="0" y="28" width="320" height="12" fill="#334155"/>
      <circle cx="20" cy="20" r="6" fill="#ef4444"/>
      <circle cx="40" cy="20" r="6" fill="#f59e0b"/>
      <circle cx="60" cy="20" r="6" fill="#10b981"/>
      <text x="160" y="25" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">terminal</text>

      <text x="15" y="70" font-family="monospace" font-size="14" fill="#64748b">$</text>
      <text x="30" y="70" font-family="monospace" font-size="14" fill="#10b981">docker pull</text>
      <text x="120" y="70" font-family="monospace" font-size="14" fill="#e2e8f0">nginx</text>

      <text x="15" y="95" font-family="monospace" font-size="13" fill="#3b82f6">→</text>
      <text x="35" y="95" font-family="monospace" font-size="13" fill="#94a3b8">using mirror:</text>
      <text x="35" y="115" font-family="monospace" font-size="13" fill="#06b6d4">docker.m.daocloud.io</text>

      <rect x="15" y="135" width="290" height="6" rx="2" fill="#334155"/>
      <rect x="15" y="135" width="220" height="6" rx="2" fill="url(#accent)"/>
      <text x="15" y="160" font-family="monospace" font-size="12" fill="#64748b">Pulling fs layer [============&gt;    ] 75%</text>

      <text x="15" y="190" font-family="monospace" font-size="13" fill="#10b981">✓</text>
      <text x="35" y="190" font-family="monospace" font-size="13" fill="#e2e8f0">Download speed:</text>
      <text x="170" y="190" font-family="monospace" font-size="13" font-weight="700" fill="#06b6d4">12.5 MB/s</text>
    </g>
  </g>

  <g transform="translate(760, 400)" filter="url(#glow)">
    <rect x="0" y="40" width="50" height="50" rx="6" fill="url(#docker-blue)"/>
    <rect x="55" y="40" width="50" height="50" rx="6" fill="url(#docker-blue)"/>
    <rect x="110" y="40" width="50" height="50" rx="6" fill="url(#docker-blue)"/>
    <rect x="27" y="0" width="50" height="50" rx="6" fill="url(#docker-blue)" opacity="0.9"/>
    <rect x="82" y="0" width="50" height="50" rx="6" fill="url(#docker-blue)" opacity="0.9"/>

    <path d="M 30 110 Q 80 90 130 110 Q 160 115 175 130 Q 155 145 80 145 Q 25 145 15 130 Q 15 115 30 110 Z" fill="url(#docker-blue)" opacity="0.95"/>
    <circle cx="50" cy="125" r="4" fill="#0f172a"/>
    <circle cx="110" cy="125" r="4" fill="#0f172a"/>
    <path d="M 100 130 Q 105 138 110 130" stroke="#0f172a" stroke-width="2" fill="none"/>
  </g>

  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff">
    Docker 镜像加速
  </text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" fill="#3b82f6">
    2026 最新国内镜像源配置
  </text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    解决拉取超时 · 提速 10 倍以上
  </text>

  <rect x="80" y="375" width="140" height="5" rx="2" fill="url(#accent)"/>

  <text x="80" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" opacity="0.9">
    小吒の博客
  </text>
  <text x="940" y="565" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" opacity="0.8">
    Docker · 开发工具 · 教程
  </text>
</svg>
