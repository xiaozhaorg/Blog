<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-code" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-code)"/>

  <g transform="translate(650, 100)">
    <rect x="0" y="0" width="450" height="300" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="450" height="36" rx="12" fill="#0f172a"/>
    <circle cx="20" cy="18" r="6" fill="#ef4444"/>
    <circle cx="40" cy="18" r="6" fill="#f59e0b"/>
    <circle cx="60" cy="18" r="6" fill="#22c55e"/>

    <g font-family="'Courier New', monospace" font-size="16">
      <text x="20" y="70" fill="#64748b">1</text>
      <text x="50" y="70" fill="#c084fc">def</text>
      <text x="95" y="70" fill="#60a5fa">generate_code</text>
      <text x="250" y="70" fill="#94a3b8">(prompt):</text>

      <text x="20" y="100" fill="#64748b">2</text>
      <text x="50" y="100" fill="#fbbf24">"""</text>

      <text x="20" y="130" fill="#64748b">3</text>
      <text x="50" y="130" fill="#94a3b8">AI coding assistant powered</text>

      <text x="20" y="160" fill="#64748b">4</text>
      <text x="50" y="160" fill="#94a3b8">by multiple LLMs.</text>

      <text x="20" y="190" fill="#64748b">5</text>
      <text x="50" y="190" fill="#fbbf24">"""</text>

      <text x="20" y="220" fill="#64748b">6</text>
      <text x="50" y="220" fill="#c084fc">return</text>
      <text x="110" y="220" fill="#34d399">Codeium</text>
      <text x="200" y="220" fill="#94a3b8">+</text>
      <text x="215" y="220" fill="#34d399">Trae</text>
      <text x="270" y="220" fill="#94a3b8">+</text>
      <text x="285" y="220" fill="#34d399">CodeGeeX</text>

      <text x="20" y="260" fill="#64748b">7</text>
      <text x="380" y="260" fill="#22d3ee">▊</text>
    </g>
  </g>

  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#ffffff">
    2026 免费 AI 编程助手
  </text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">
    Codeium · Trae · CodeGeeX 横评对比
  </text>

  <rect x="80" y="380" width="120" height="4" rx="2" fill="url(#accent-code)"/>

  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#64748b">
    小吒の博客
  </text>
  <text x="950" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#475569">
    AI · 开发工具 · 免费工具
  </text>
</svg>