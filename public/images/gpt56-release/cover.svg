    <circle cx="60" cy="60" r="35" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
    <circle cx="60" cy="60" r="20" fill="#00d4ff" opacity="0.8"/>
    <line x1="60" y1="5" x2="60" y2="25" stroke="#00d4ff" stroke-width="2"/>
    <line x1="60" y1="95" x2="60" y2="115" stroke="#00d4ff" stroke-width="2"/>
    <line x1="5" y1="60" x2="25" y2="60" stroke="#00d4ff" stroke-width="2"/>
    <line x1="95" y1="60" x2="115" y2="60" stroke="#00d4ff" stroke-width="2"/>
    <line x1="20" y1="20" x2="35" y2="35" stroke="#00d4ff" stroke-width="2"/>
    <line x1="85" y1="85" x2="100" y2="100" stroke="#00d4ff" stroke-width="2"/>
    <line x1="100" y1="20" x2="85" y2="35" stroke="#00d4ff" stroke-width="2"/>
    <line x1="35" y1="85" x2="20" y2="100" stroke="#00d4ff" stroke-width="2"/>
