<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-cf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8fafc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-cf)"/>

  <g transform="translate(680, 140)" filter="url(#shadow)">
    <ellipse cx="100" cy="130" rx="120" ry="45" fill="url(#cloud)"/>
    <ellipse cx="50" cy="110" rx="60" ry="45" fill="url(#cloud)"/>
    <ellipse cx="150" cy="115" rx="55" ry="40" fill="url(#cloud)"/>
    <ellipse cx="90" cy="85" rx="55" ry="40" fill="url(#cloud)"/>
    <ellipse cx="130" cy="75" rx="45" ry="35" fill="url(#cloud)"/>
  </g>

  <g transform="translate(750, 320)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="10" y="15" width="60" height="8" rx="2" fill="#f97316" opacity="0.7"/>
    <rect x="10" y="35" width="140" height="5" rx="1" fill="#cbd5e1"/>
    <rect x="10" y="50" width="120" height="5" rx="1" fill="#e2e8f0"/>
    <rect x="10" y="65" width="100" height="5" rx="1" fill="#e2e8f0"/>
    <rect x="10" y="85" width="50" height="15" rx="3" fill="#f97316"/>
    <polygon points="30,120 50,135 70,120" fill="#ffffff" opacity="0.95"/>
    <rect x="45" y="135" width="10" height="20" fill="#ffffff" opacity="0.95"/>
  </g>

  <text x="80" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff">
    零成本建站
  </text>
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#ffffff" opacity="0.9">
    Cloudflare Workers 免费搭建个人博客
  </text>

  <rect x="80" y="380" width="120" height="4" rx="2" fill="#ffffff" opacity="0.8"/>

  <text x="80" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#ffffff" opacity="0.8">
    小吒の博客
  </text>
  <text x="950" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#ffffff" opacity="0.6">
