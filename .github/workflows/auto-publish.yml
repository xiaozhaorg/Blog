name: Auto Publish Scheduled Posts

on:
  # 每天北京时间 8:00 (UTC 0:00) 触发
  schedule:
    - cron: '0 0 * * *'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of posts to publish'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish pending posts
        env:
          PUBLISH_COUNT: ${{ github.event.inputs.count || '3' }}
        run: |
          python .github/scripts/publish_posts.py "$PUBLISH_COUNT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: auto-publish scheduled posts ($(date -u +'%Y-%m-%d'))"
            git push
          fi
